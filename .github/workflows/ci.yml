name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: bash tools/audit.sh
      - run: mix compile --warnings-as-errors
        env:
          MIX_ENV: test
      - run: mix test

  chaos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-chaos-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-chaos-${{ runner.os }}-
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: mix deps.get
      - run: mix compile
      # Three full regions, three redis servers, a real partition, a real
      # heal, and a convergence assertion. The test that earns the name.
      - run: python3 tools/chaos/chaos.py
        timeout-minutes: 8

# One region of a multi-master SREChat mesh. Built natively on the VM
# (amd64) — no cross-arch emulation. Redis is published on the WireGuard
# interface so peer regions can tail this region's oplog; peers are reached
# over the same tunnel. Env comes from deploy/<region>.env.
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MIX_ENV: prod
      # BEAM defaults to latin1 in a minimal container, which Elixir warns can
      # corrupt UTF-8; +fnu forces UTF-8 filename handling.
      LANG: "C.UTF-8"
      ELIXIR_ERL_OPTIONS: "+fnu"
      PORT: "4000"
      PUBLIC_HOST: "${PUBLIC_HOST}"
      PUBLIC_WS_PORT: "443"
      COMETCHAT_APP_ID: "srechat"
      COMETCHAT_API_KEY: "${COMETCHAT_API_KEY}"
      COMETCHAT_REGION: "us"
      ACCEPT_UID_TOKENS: "true"
      CORS_ALLOWED_ORIGINS: "*"
      MEDIA_STORAGE: "local"
      ALLOW_LOCAL_MEDIA_STORAGE: "true"
      UPLOAD_DIR: "/app/uploads"
      # host networking: reach the local redis on loopback, not a compose DNS name.
      REDIS_URL: "redis://127.0.0.1:6379/0"
      REDIS_KEY_PREFIX: "srechat"
      # Inbound webhooks (Sentry, GCP alerting, CI, forwarded help@). Unset
      # makes /hooks refuse everything, which is the right default: an open
      # endpoint that posts to a pager is worse than a missing one.
      SRE_WEBHOOK_SECRET: "${SRE_WEBHOOK_SECRET}"
      SRE_OWNER_UID: "${SRE_OWNER_UID:-joseph}"
      ID_ALLOCATOR: "region"
      REGION_INDEX: "${REGION_INDEX}"
      REPLICATION_MODE: "multi_master"
      PEER_REGIONS: "${PEER_REGIONS}"
      WEBSOCKET_HEARTBEAT_MS: "25000"
    depends_on:
      - redis
    network_mode: host
    volumes:
      - uploads:/app/uploads

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Reachable locally AND from peer regions over WireGuard, nowhere else.
    #
    # PERSISTENCE IS REQUIRED, not an optimisation. This ran with `--save ""
    # --appendonly no`, which is a reasonable choice for a cache and a wrong one
    # here: the oplog stream in this Redis is the replication source of truth,
    # and every peer region stores a cursor pointing into it.
    #
    # Losing it on restart does not cost a cache warm-up — it strands every
    # peer. The peer's cursor then names an entry that no longer exists, its
    # tailer refuses to continue (correctly — it cannot know what it missed),
    # and replication stops silently until someone resets the cursor and
    # replays everything. That happened three times in one night from three
    # unrelated restarts.
    #
    # appendfsync everysec: at most one second of oplog loss on an unclean
    # stop, which peers recover from by reading on, versus losing the whole
    # stream and needing a full resync.
    command: ["redis-server", "--bind", "127.0.0.1 ${WG_IP}", "--protected-mode", "no", "--save", "900 1 300 10 60 10000", "--appendonly", "yes", "--appendfsync", "everysec", "--dir", "/data"]
    network_mode: host
    volumes:
      - redis-data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../priv/web:/srv/web:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  redis-data:
  caddy-data:
  caddy-config:
  uploads:

# One region of a multi-master SREChat mesh. Built natively on the VM
# (amd64) — no cross-arch emulation. Redis is published on the WireGuard
# interface so peer regions can tail this region's oplog; peers are reached
# over the same tunnel. Env comes from deploy/<region>.env.
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MIX_ENV: prod
      # BEAM defaults to latin1 in a minimal container, which Elixir warns can
      # corrupt UTF-8; +fnu forces UTF-8 filename handling.
      LANG: "C.UTF-8"
      ELIXIR_ERL_OPTIONS: "+fnu"
      PORT: "4000"
      PUBLIC_HOST: "${PUBLIC_HOST}"
      PUBLIC_WS_PORT: "443"
      COMETCHAT_APP_ID: "srechat"
      COMETCHAT_API_KEY: "${COMETCHAT_API_KEY}"
      COMETCHAT_REGION: "us"
      ACCEPT_UID_TOKENS: "true"
      CORS_ALLOWED_ORIGINS: "*"
      MEDIA_STORAGE: "local"
      ALLOW_LOCAL_MEDIA_STORAGE: "true"
      UPLOAD_DIR: "/app/uploads"
      # host networking: reach the local redis on loopback, not a compose DNS name.
      REDIS_URL: "redis://127.0.0.1:6379/0"
      REDIS_KEY_PREFIX: "srechat"
      ID_ALLOCATOR: "region"
      REGION_INDEX: "${REGION_INDEX}"
      REPLICATION_MODE: "multi_master"
      PEER_REGIONS: "${PEER_REGIONS}"
      WEBSOCKET_HEARTBEAT_MS: "25000"
    depends_on:
      - redis
    network_mode: host
    volumes:
      - uploads:/app/uploads

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Reachable locally AND from peer regions over WireGuard, nowhere else.
    command: ["redis-server", "--bind", "127.0.0.1 ${WG_IP}", "--protected-mode", "no", "--save", "", "--appendonly", "no"]
    network_mode: host

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../priv/web:/srv/web:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
  uploads:

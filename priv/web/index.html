<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SREChat</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#111; --muted:#666; --line:#e3e3e3; --mine:#2a6df4; --accent:#6b3a1a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --muted:#999; --line:#2a2a2a; } }
  * { box-sizing: border-box; }
  /* height:100vh is WRONG on iOS: WKWebView's 100vh is the tallest viewport
     (behind browser chrome / the home indicator), taller than the visible
     frame, so bottom content (the composer, or the login form) is clipped off
     screen. dvh / -webkit-fill-available is the actually-visible height. */
  html { height:-webkit-fill-available; }
  body { margin:0; font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--fg); height:100vh; height:-webkit-fill-available; height:100dvh; display:flex; flex-direction:column; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header b { color:var(--accent); }
  #region { font-size:13px; color:var(--muted); margin-left:auto; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:min(680px,80%); padding:8px 12px; border-radius:14px; background:var(--line); word-wrap:break-word; white-space:pre-wrap; }
  .msg.mine { align-self:flex-end; background:var(--mine); color:#fff; }
  .msg .who { display:block; font-size:12px; opacity:.7; margin-bottom:2px; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
  /* An author `display` rule outranks the UA `[hidden]{display:none}`, so
     without this the composer form (marked `hidden` until login) shows on top
     of the login form. Keep hidden actually hidden. */
  [hidden] { display:none !important; }
  input, button { font:inherit; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  input { flex:1; min-width:0; }
  button { cursor:pointer; }
  #status { padding:8px 16px; font-size:13px; color:var(--muted); }
  /* Keep the login form near the top, above the flex-grow log. Otherwise it
     sits at the document bottom and an iOS WKWebView (100vh past the home
     indicator) clips it, so the sign-in form is invisible in the app. Order
     only reflows the flex children; post-login the form is hidden and the log
     + composer take over normally. */
  #login { order:1; } #log { order:2; } #composer { order:3; }
</style>

<header>
  <b>SREChat</b>
  <span id="who"></span>
  <span id="region"></span>
</header>
<div id="status">Connecting…</div>
<div id="log"></div>
<form id="composer" hidden>
  <input id="text" placeholder="Message…" autocomplete="off">
  <button>Send</button>
</form>

<form id="login">
  <input id="uid" placeholder="your user id (e.g. joseph)" autocomplete="off">
  <input id="peer" placeholder="talk to (e.g. sre-agent)" value="sre-agent" autocomplete="off">
  <button>Start</button>
</form>

<script type="module">
// The CometChat JS SDK is the wire the backend was built and verified
// against, so this is the shortest path to a client that actually works.
// It ships as CommonJS, so esm.sh exposes it as the DEFAULT export — a named
// `{ CometChat }` import fails with "does not provide an export named".
import SDK from "https://esm.sh/@cometchat/chat-sdk-javascript@4.1.8";
const CometChat = SDK.CometChat ?? SDK;

const HOST = location.host + "/v3.0";       // this region, whichever one served the page
const APP_ID = "srechat";
const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");
const loginForm = document.getElementById("login");
const composer = document.getElementById("composer");

document.getElementById("region").textContent = location.hostname;

function say(text, who, mine) {
  const el = document.createElement("div");
  el.className = "msg" + (mine ? " mine" : "");
  el.innerHTML = `<span class="who"></span>`;
  el.querySelector(".who").textContent = who;
  el.appendChild(document.createTextNode(text));
  logEl.appendChild(el);
  logEl.scrollTop = logEl.scrollHeight;
}

const settings = new CometChat.AppSettingsBuilder()
  .subscribePresenceForAllUsers()
  .setRegion("us")
  .overrideAdminHost(HOST)
  .overrideClientHost(HOST)
  .build();

await CometChat.init(APP_ID, settings);
statusEl.textContent = "Connected to " + location.hostname + " — sign in.";

let me = null, peer = null;

loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const uid = document.getElementById("uid").value.trim();
  peer = document.getElementById("peer").value.trim();
  if (!uid || !peer) return;
  statusEl.textContent = "Signing in…";
  try {
    // uid:<name> bearer token — the backend's ACCEPT_UID_TOKENS mode. No admin
    // key ever reaches the browser.
    const user = await CometChat.login("uid:" + uid);
    me = user.getUid();
    document.getElementById("who").textContent = me + " → " + peer;
    loginForm.hidden = true;
    composer.hidden = false;
    statusEl.textContent = "";

    const history = await new CometChat.MessagesRequestBuilder()
      .setUID(peer).setLimit(50).build().fetchPrevious();
    for (const m of history) {
      if (m.getType() === "text") say(m.getText(), m.getSender().getUid(), m.getSender().getUid() === me);
    }

    CometChat.addMessageListener("srechat-web", new CometChat.MessageListener({
      onTextMessageReceived: (m) => say(m.getText(), m.getSender().getUid(), false)
    }));
  } catch (err) {
    statusEl.textContent = "Sign-in failed: " + (err?.message || JSON.stringify(err));
  }
});

composer.addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = document.getElementById("text");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  say(text, me, true);
  try {
    await CometChat.sendMessage(
      new CometChat.TextMessage(peer, text, CometChat.RECEIVER_TYPE.USER)
    );
  } catch (err) {
    say("(failed to send: " + (err?.message || "unknown") + ")", "system", false);
  }
});
</script>

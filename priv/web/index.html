<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SREChat</title>
<style>
  :root {
    --bg:#ffffff; --fg:#111418; --muted:#6b7280; --line:#e5e7eb;
    --mine:#2563eb; --mine-fg:#ffffff; --theirs:#f1f3f5; --theirs-fg:#111418;
    --accent:#7a3b12; --ok:#16a34a; --bad:#dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0b0d10; --fg:#e6e8eb; --muted:#9aa4b2; --line:#1f242b;
      --mine:#2563eb; --mine-fg:#ffffff; --theirs:#161a20; --theirs-fg:#e6e8eb;
      --accent:#e0a06a;
    }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { height:-webkit-fill-available; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    height:100vh; height:100dvh; height:-webkit-fill-available;
    display:flex; flex-direction:column;
  }
  [hidden] { display:none !important; }
  header {
    padding:calc(env(safe-area-inset-top) + 10px) 16px 10px; border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
  }
  header b { color:var(--accent); font-size:18px; }
  #who { font-weight:600; }
  #region { color:var(--muted); font-size:13px; margin-left:auto; }
  #dot { width:8px; height:8px; border-radius:50%; background:var(--muted); display:inline-block; }
  #dot.ok { background:var(--ok); } #dot.bad { background:var(--bad); }

  /* peer picker */
  #peers { display:flex; gap:8px; padding:10px 16px; overflow-x:auto; border-bottom:1px solid var(--line); }
  #peers button {
    flex:0 0 auto; padding:8px 16px; border-radius:999px; border:1px solid var(--line);
    background:var(--theirs); color:var(--fg); font:inherit; font-size:14px; line-height:1;
    cursor:pointer; -webkit-appearance:none; appearance:none; margin:0; text-align:center;
    display:inline-flex; align-items:center; justify-content:center;
  }
  #peers button.active { background:var(--mine); color:var(--mine-fg); border-color:var(--mine); }
  /* An unread count has to be loud: a missed alert is the whole failure mode. */
  #peers button.badged { border-color:var(--bad); box-shadow:inset 0 0 0 1px var(--bad); font-weight:600; }
  #peers button.badged:not(.active) { background:#fee2e2; color:#991b1b; }
  @media (prefers-color-scheme: dark){ #peers button.badged:not(.active){ background:#3b1414; color:#fca5a5; } }
  #alertbar {
    position:fixed; left:8px; right:8px; top:calc(env(safe-area-inset-top) + 6px); z-index:50;
    background:var(--bad); color:#fff; padding:11px 14px; border-radius:12px; font-size:14px;
    box-shadow:0 6px 20px rgba(0,0,0,.28); cursor:pointer;
  }

  #log { flex:1; overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column; gap:8px; -webkit-overflow-scrolling:touch; }
  .row { display:flex; }
  .row.mine { justify-content:flex-end; }
  .bubble { max-width:82%; padding:9px 13px; border-radius:16px; white-space:pre-wrap; word-wrap:break-word; overflow-wrap:anywhere; }
  .row.theirs .bubble { background:var(--theirs); color:var(--theirs-fg); border-bottom-left-radius:5px; }
  .row.mine .bubble { background:var(--mine); color:var(--mine-fg); border-bottom-right-radius:5px; }
  .who { display:block; font-size:11px; opacity:.65; margin-bottom:2px; }
  /* Timestamp on every message. Small and low-contrast so a wall of chat still
     reads as chat, but present on each bubble: when an agent pages you, the
     first question is always "when did this start?" */
  .ts { display:block; font-size:10px; opacity:.55; margin-top:3px; text-align:right; font-variant-numeric:tabular-nums; }
  .row.system .ts, .row.alert .ts { text-align:left; }
  .row.system .bubble { background:transparent; color:var(--muted); font-size:13px; max-width:100%; text-align:center; }
  .row.alert .bubble { background:#fff7ed; color:#9a3412; border:1px solid #fdba74; max-width:100%; }
  @media (prefers-color-scheme: dark){ .row.alert .bubble { background:#2a1a0e; color:#fdba74; border-color:#7c3d12; } }

  form { display:flex; gap:8px; padding:10px 12px calc(env(safe-area-inset-bottom) + 10px); border-top:1px solid var(--line); }
  input, button { font:inherit; }
  input[type=text] { flex:1; padding:11px 14px; border-radius:14px; border:1px solid var(--line); background:var(--bg); color:var(--fg); min-width:0; }
  form button { padding:11px 16px; border-radius:14px; border:1px solid var(--mine); background:var(--mine); color:var(--mine-fg); cursor:pointer; }
  #login { flex-direction:column; align-items:stretch; gap:10px; padding:18px 16px; }
  #login .hint { color:var(--muted); font-size:13px; }
  #status { padding:8px 16px; font-size:13px; color:var(--muted); }
</style>

<header>
  <b>SREChat</b>
  <span id="who"></span>
  <span id="region"><span id="dot"></span> <span id="regionName">…</span></span>
</header>

<div id="status">Sign in to start.</div>

<form id="login">
  <input id="uid" type="text" placeholder="your name (e.g. joseph)" autocomplete="username" autocapitalize="off" autocorrect="off">
  <input id="pass" type="password" placeholder="passcode" autocomplete="current-password" autocapitalize="off" autocorrect="off">
  <button type="submit">Start</button>
  <span class="hint">Your name and the deployment passcode. Land in a room with your three cloud agents.</span>
</form>

<nav id="peers" hidden></nav>
<div id="log" hidden></div>
<form id="composer" hidden>
  <input id="text" type="text" placeholder="Message…" autocomplete="off">
  <button type="submit">Send</button>
</form>

<script>
// SREChat client — talks the SREChat REST API directly (no third-party SDK), so
// send is a plain POST that works identically in every browser and inside an iOS
// WKWebView, and receive is short-poll (dead simple, no WebSocket to flap). For a
// personal ops room where the agents answer in seconds, a 2s poll is invisible.
const API = "https://" + location.host + "/v3.0";
const APP_ID = "srechat";
const HOST = location.hostname;

const $ = (id) => document.getElementById(id);
const el = { who:$("who"), region:$("regionName"), dot:$("dot"), status:$("status"),
  login:$("login"), peers:$("peers"), log:$("log"), composer:$("composer"),
  uid:$("uid"), text:$("text") };

// The default room: your three cloud agents. Add anyone else by name later.
const AGENTS = [
  { uid:"sre-agent-0", label:"GCP agent" },
  { uid:"sre-agent-1", label:"AWS agent" },
  { uid:"sre-agent-2", label:"Azure agent" },
];

// A pseudo-peer: the aggregated alert feed, not a real chat partner.
const ALERTS_VIEW = "__alerts__";
// The drill runner reports as its own user, so watch it alongside the agents.
const WATCHED = [...AGENTS.map(a => a.uid), "sre-drill"];

let me = null, peer = null, token = null;
const seen = {};          // peer -> highest message id seen (any tab)
const unread = {};        // peer -> unread count while you're elsewhere
const alerts = [];        // aggregated 🔔 across every agent
let unseenAlerts = 0;
let pollTimer = null;

el.region.textContent = HOST;

function headers() {
  return { "authToken": token, "appId": APP_ID, "Content-Type": "application/json" };
}

async function api(method, path, body) {
  const res = await fetch(API + path, {
    method, headers: headers(),
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await res.text();
  let json; try { json = text ? JSON.parse(text) : {}; } catch { json = { raw:text }; }
  if (!res.ok) throw Object.assign(new Error("HTTP " + res.status), { status:res.status, json });
  return json;
}

// Messages carry `sentAt` as Unix SECONDS. Anything past ~2001 in milliseconds
// is over 1e12, so that threshold tells the two apart and a future backend that
// switches units can't silently render every message as 1970.
function fmtStamp(sentAt) {
  const n = Number(sentAt);
  if (!isFinite(n) || n <= 0) return null;
  const d = new Date(n > 1e12 ? n : n * 1000);
  if (isNaN(d.getTime())) return null;
  const time = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const now = new Date();
  if (d.toDateString() === now.toDateString()) return time;
  const opts = d.getFullYear() === now.getFullYear()
    ? { month: "short", day: "numeric" }
    : { year: "numeric", month: "short", day: "numeric" };
  return d.toLocaleDateString([], opts) + ", " + time;
}

function bubble(text, who, kind, sentAt) {
  const row = document.createElement("div");
  row.className = "row " + kind;                // mine | theirs | system | alert
  const b = document.createElement("div");
  b.className = "bubble";
  if (who && (kind === "theirs")) {
    const w = document.createElement("span"); w.className = "who"; w.textContent = who; b.appendChild(w);
  }
  b.appendChild(document.createTextNode(text));
  const stamp = fmtStamp(sentAt);
  if (stamp) {
    const t = document.createElement("span");
    t.className = "ts";
    t.textContent = stamp;
    // Full absolute time on hover/long-press: the short form drops the date for
    // today's messages, and during an incident you want the exact second.
    t.title = new Date(Number(sentAt) > 1e12 ? Number(sentAt) : Number(sentAt) * 1000).toString();
    b.appendChild(t);
  }
  row.appendChild(b);
  el.log.appendChild(row);
  el.log.scrollTop = el.log.scrollHeight;
}

function renderPeers() {
  el.peers.innerHTML = "";
  const tabs = [{ uid: ALERTS_VIEW, label: "🔔 Alerts" }, ...AGENTS];
  for (const a of tabs) {
    const btn = document.createElement("button");
    const count = (a.uid === ALERTS_VIEW) ? unseenAlerts : (unread[a.uid] || 0);
    btn.textContent = a.label + (count ? "  " + count : "");
    btn.className = (a.uid === peer ? "active " : "") + (count ? "badged" : "");
    btn.onclick = () => selectPeer(a.uid);
    el.peers.appendChild(btn);
  }
  // Alerts also drive the tab title, so a page left open shows the count.
  document.title = unseenAlerts ? `(${unseenAlerts}) SREChat` : "SREChat";
}

async function selectPeer(uid) {
  peer = uid;
  el.log.innerHTML = "";
  if (uid === ALERTS_VIEW) {
    el.composer.hidden = true;
    unseenAlerts = 0;
    renderPeers();
    renderAlerts();
    return;
  }
  el.composer.hidden = false;
  unread[uid] = 0;
  renderPeers();
  seen[peer] = 0;
  await loadHistory();
}

// Load existing history for every watched agent BEFORE polling starts, so past
// alerts are visible in the feed but don't each fire a banner. Without this the
// first poll treats all history as new and pages you for week-old incidents.
async function primeAlerts() {
  for (const uid of WATCHED) {
    try {
      const r = await api("GET", `/users/${encodeURIComponent(uid)}/messages?per_page=30`);
      for (const m of (r.data || [])) {
        if (m.type !== "text") continue;
        seen[uid] = Math.max(seen[uid] || 0, Number(m.id) || 0);
        const text = (m.data && m.data.text) || "";
        if ((text.startsWith("🔔") || text.startsWith("🧪")) && m.sender !== me) {
          alerts.push({ text, from: m.sender, at: Number(m.sentAt) || 0 });
        }
      }
    } catch (e) { /* a peer with no history is fine */ }
  }
}

// The alert feed: every 🔔 from any agent, newest last, labelled with who saw it.
function renderAlerts() {
  el.log.innerHTML = "";
  if (!alerts.length) {
    bubble("No alerts. You'll see node/agent failures and error spikes here, from whichever cloud is still alive to report them.", "system", "system");
    return;
  }
  for (const a of alerts.slice(-60)) bubble(a.text, a.from, "alert", a.at);
}

async function loadHistory() {
  try {
    const r = await api("GET", `/users/${encodeURIComponent(peer)}/messages?per_page=50`);
    const msgs = (r.data || []).filter(m => m.type === "text");
    for (const m of msgs) {
      renderMessage(m, true);
      seen[peer] = Math.max(seen[peer] || 0, Number(m.id) || 0);
    }
    if (!msgs.length) bubble("Say hi — try “are all three regions healthy?”", peer, "system");
  } catch (e) {
    if (e.status === 404) { /* no history yet */ }
    else bubble("(couldn't load history: " + (e.message||e) + ")", "system", "system");
  }
}

function renderMessage(m, isHistory) {
  const text = (m.data && m.data.text) || "";
  const from = m.sender;
  const at = Number(m.sentAt) || 0;
  if (from === me) bubble(text, from, "mine", at);
  else {
    // A message from an agent that starts with 🔔 is treated as an alert.
    const kind = text.startsWith("🔔") ? "alert" : "theirs";
    bubble(text, from, kind, at);
  }
}

// Poll EVERY agent, not just the tab in view. An alert is most likely to come
// from a cloud you're not looking at — the surviving one reporting the dead one
// — so only polling the visible conversation is exactly how you miss a page.
async function poll() {
  if (!token) return;
  let ok = false;
  for (const uid of WATCHED) {
    try {
      const r = await api("GET", `/users/${encodeURIComponent(uid)}/messages?per_page=20`);
      ok = true;
      const fresh = (r.data || [])
        .filter(m => m.type === "text" && (Number(m.id) || 0) > (seen[uid] || 0))
        .sort((a, b) => (Number(a.id) || 0) - (Number(b.id) || 0));
      for (const m of fresh) {
        seen[uid] = Math.max(seen[uid] || 0, Number(m.id) || 0);
        const text = (m.data && m.data.text) || "";
        const isAlert = text.startsWith("🔔") || text.startsWith("🧪");
        if (isAlert && m.sender !== me) {
          alerts.push({ text, from: m.sender, at: Number(m.sentAt) || 0 });
          if (peer !== ALERTS_VIEW) { unseenAlerts++; notifyAlert(text, m.sender); }
          if (peer === ALERTS_VIEW) bubble(text, m.sender, "alert", Number(m.sentAt) || 0);
        }
        if (uid === peer) renderMessage(m, false);
        else if (m.sender !== me && !isAlert) unread[uid] = (unread[uid] || 0) + 1;
      }
    } catch (e) { /* one peer failing shouldn't stop the rest */ }
  }
  renderPeers();
  setDot(ok);
}

// Make a new alert impossible to miss while the app is open: a banner at the
// top that stays until acknowledged, plus a vibration where supported.
function notifyAlert(text, from) {
  try { if (navigator.vibrate) navigator.vibrate([120, 60, 120]); } catch {}
  // In the iOS app, hand the alert to native code so it becomes a real
  // notification (banner + sound) instead of only a bar inside a screen you
  // might not be looking at.
  try {
    window.webkit?.messageHandlers?.sreAlert?.postMessage({
      title: "SREChat: " + from,
      body: text.replace(/^🔔\s*/, "").split("\n").slice(0, 3).join(" ").slice(0, 220),
      id: String(Date.now()),
    });
  } catch {}
  let bar = document.getElementById("alertbar");
  if (!bar) {
    bar = document.createElement("div");
    bar.id = "alertbar";
    bar.onclick = () => { selectPeer(ALERTS_VIEW); bar.remove(); };
    document.body.appendChild(bar);
  }
  bar.textContent = `🔔 ${from}: ${text.replace(/^🔔\s*/, "").split("\n")[0].slice(0, 90)} — tap to view`;
}

function setDot(ok) { el.dot.className = ok ? "ok" : "bad"; }

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(poll, 2000);
}

async function signIn(tok, name) {
  me = name; token = tok;
  el.status.hidden = false;
  el.status.textContent = "Signing in…";
  try {
    await api("PUT", "/me", {});           // validates the token (incl. passcode)
    try { localStorage.setItem("sre_token", token); localStorage.setItem("sre_me", me); } catch {}
    el.who.textContent = me;
    el.status.hidden = true;
    el.login.hidden = true;
    el.peers.hidden = false;
    el.log.hidden = false;
    el.composer.hidden = false;
    renderPeers();
    await primeAlerts();
    await selectPeer(ALERTS_VIEW);
    startPolling();
  } catch (e2) {
    try { localStorage.removeItem("sre_token"); } catch {}
    el.login.hidden = false; el.peers.hidden = true; el.log.hidden = true; el.composer.hidden = true;
    el.status.hidden = false;
    el.status.textContent = (e2.status === 401 || e2.status === 403)
      ? "Wrong passcode — try again." : "Sign-in failed: " + (e2.message || e2);
  }
}

el.login.addEventListener("submit", (e) => {
  e.preventDefault();
  const name = el.uid.value.trim().toLowerCase().replace(/[^a-z0-9_.-]/g, "");
  const pass = document.getElementById("pass").value;
  if (!name) return;
  // The passcode gates access server-side as uid:<name>|<passcode>.
  signIn("uid:" + name + (pass ? "|" + pass : ""), name);
});

el.composer.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = el.text.value.trim();
  if (!text || !peer) return;
  el.text.value = "";
  bubble(text, me, "mine", Math.floor(Date.now() / 1000));   // optimistic
  try {
    const sent = await api("POST", "/messages", {
      receiver: peer, receiverType: "user", category: "message",
      type: "text", data: { text },
    });
    if (sent && sent.data && sent.data.id) seen[peer] = Math.max(seen[peer] || 0, Number(sent.data.id) || 0);
  } catch (e2) {
    bubble("(failed to send: " + (e2.message || e2) + ")", "system", "system");
  }
});

// Refresh the health dot, then auto sign-in if we already hold a valid token.
(async () => {
  try { await fetch("https://" + location.host + "/health"); setDot(true); } catch { setDot(false); }
  try {
    const tok = localStorage.getItem("sre_token"), name = localStorage.getItem("sre_me");
    if (tok && name) { el.uid.value = name; signIn(tok, name); }
  } catch {}
})();
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
</script>
